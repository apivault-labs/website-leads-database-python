[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "website-leads-database"
version = "0.1.0"
description = "Python SDK for Shopify & Ecommerce Store Finder on Apify. Find ecommerce and business websites by public platform, country, contact and firmographic filters through the hosted Apify Actor."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ApiVault Labs" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0"]
keywords = ["website-leads", "shopify-leads", "ecommerce-leads", "b2b-leads", "technology-database", "apify", "python-sdk"]

[project.urls]
Homepage = "https://github.com/apivault-labs/website-leads-database-python"
Documentation = "https://github.com/apivault-labs/website-leads-database-python#readme"
"Apify Actor" = "https://apify.com/apivault_labs/website-leads-database"
"Bug Tracker" = "https://github.com/apivault-labs/website-leads-database-python/issues"

[tool.setuptools.packages.find]
include = ["website_leads_database*"]
